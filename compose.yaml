services:
  proof-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: showcase
      POSTGRES_PASSWORD: showcase
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showcase -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 20
